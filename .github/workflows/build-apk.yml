name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Localizar e compilar projeto
        shell: bash
        run: |
          SETTINGS=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle ou settings.gradle.kts não encontrado."
            echo "Arquivos encontrados no repositório:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Projeto Android encontrado em: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Localizar APK
        shell: bash
        run: |
          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado após a compilação."
            exit 1
          fi

          echo "APK encontrado: $APK"
          mkdir -p apk-final
          cp "$APK" apk-final/VI-Countdown.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: VI-Countdown-APK
          path: apk-final/VI-Countdown.apk
          if-no-files-found: error

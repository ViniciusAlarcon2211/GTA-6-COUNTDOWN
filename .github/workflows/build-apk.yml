name: Gerar APK V3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto V3
        shell: bash
        run: |
          set -e

          ZIP_FILE="VI_Countdown_V3_Cinematic.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERRO: $ZIP_FILE nao foi encontrado."
            echo "Arquivos presentes na raiz:"
            ls -la
            exit 1
          fi

          rm -rf projeto-v3
          mkdir -p projeto-v3

          unzip -q "$ZIP_FILE" -d projeto-v3

          echo "=== V3 extraida com sucesso ==="
          find projeto-v3 -maxdepth 3 -type f | sort | head -100

          echo "=== Procurando projeto Android ==="
          find projeto-v3 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK V3
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find projeto-v3 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERRO: settings.gradle nao encontrado dentro da V3."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Projeto Android:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle assembleDebug --no-daemon --stacktrace

      - name: Localizar APK V3
        shell: bash
        run: |
          set -e

          APK_FILE="$(find projeto-v3 -type f -name "*debug*.apk" | head -1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERRO: nenhum APK debug foi encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK_FILE"

          mkdir -p apk-final
          cp "$APK_FILE" "apk-final/VI-Countdown-V3.apk"

      - name: Disponibilizar APK V3
        uses: actions/upload-artifact@v4
        with:
          name: VI-Countdown-V3-APK
          path: apk-final/VI-Countdown-V3.apk
          if-no-files-found: error

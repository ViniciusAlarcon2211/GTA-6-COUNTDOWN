name: Gerar APK V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto V2
        run: |
          mkdir -p projeto-v2
          unzip -q "VI_Countdown_V2_Gourmet.zip" -d projeto-v2
          echo "Conteudo extraido:"
          find projeto-v2 -maxdepth 3 -type f | head -50

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        working-directory: projeto-v2/VI_Countdown
        run: gradle assembleDebug --no-daemon

      - name: Localizar APK
        run: |
          echo "APK gerado:"
          find projeto-v2 -type f -name "*.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: VI-Countdown-V2-APK
          path: projeto-v2/VI_Countdown/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Gerar APK V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto V2
        run: |
          mkdir -p projeto-v2
          unzip -q "VI_Countdown_V2_Gourmet_CORRIGIDO.zip" -d projeto-v2

          echo "=== Projeto extraido ==="
          find projeto-v2 -maxdepth 3 -type f | sort | head -100

          echo "=== settings.gradle encontrado ==="
          find projeto-v2 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        shell: bash
        run: |
          SETTINGS_FILE="$(find projeto-v2 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERRO: settings.gradle nao encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Projeto Android localizado em:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Localizar APK
        shell: bash
        run: |
          APK_FILE="$(find projeto-v2 -type f -name "*debug*.apk" | head -1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERRO: APK nao encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK_FILE"

          mkdir -p apk-final
          cp "$APK_FILE" "apk-final/VI-Countdown-V2.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: VI-Countdown-V2-APK
          path: apk-final/VI-Countdown-V2.apk
          if-no-files-found: error
